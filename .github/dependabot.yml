version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-tooling:
        patterns:
          - "@playwright/*"
          - "allure-*"
      development-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "prettier"
          - "@types/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
