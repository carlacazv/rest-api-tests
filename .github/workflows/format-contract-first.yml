name: Format contract-first comparison

on:
  push:
    branches:
      - architecture/contract-first

permissions:
  contents: write

concurrency:
  group: format-contract-first
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out comparison branch
        uses: actions/checkout@v6
        with:
          ref: architecture/contract-first
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install declared dependencies
        run: npm install --ignore-scripts

      - name: Apply repository formatting
        run: npm run format

      - name: Remove temporary workflow
        run: rm .github/workflows/format-contract-first.yml

      - name: Commit formatted comparison
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --message 'format contract-first comparison'
          git push origin HEAD:architecture/contract-first
