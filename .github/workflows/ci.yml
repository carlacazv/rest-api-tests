name: API Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_authenticated:
        description: "Run authenticated read-only tests"
        required: false
        default: false
        type: boolean
      run_mutations:
        description: "Run mutation lifecycle tests"
        required: false
        default: false
        type: boolean

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check formatting and types
        run: npm run check

  public-tests:
    name: Public and non-destructive tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    env:
      DOG_API_ROOT: https://api.thedogapi.com
      DOG_API_BASE_URL: https://api.thedogapi.com/v1
      DOG_API_OPENAPI_URL: https://api.thedogapi.com/openapi-json
      RESPONSE_TIME_BUDGET_MS: 4000
      TEST_WORKERS: 4
      MAX_OPENAPI_PROBES: 2000
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run public suite
        run: npm run test:public
      - name: Generate endpoint coverage
        if: always()
        run: npm run coverage:report
      - name: Upload public test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-test-results
          path: |
            allure-results
            playwright-report
            test-results
            artifacts
          if-no-files-found: warn
          retention-days: 14

  authenticated-tests:
    name: Authenticated read-only tests
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_authenticated }}
    timeout-minutes: 15
    env:
      DOG_API_KEY: ${{ secrets.DOG_API_KEY }}
      DOG_API_SUB_ID: github-actions-${{ github.run_id }}
      TEST_WORKERS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify secret is configured
        shell: bash
        run: test -n "$DOG_API_KEY"
      - name: Run authenticated suite
        run: npm run test:authenticated
      - name: Upload authenticated results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-test-results
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

  mutation-tests:
    name: Mutation lifecycle tests
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mutations }}
    timeout-minutes: 20
    env:
      DOG_API_KEY: ${{ secrets.DOG_API_KEY }}
      DOG_API_SUB_ID: github-actions-${{ github.run_id }}
      RUN_MUTATION_TESTS: true
      RUN_UPLOAD_TESTS: false
      TEST_WORKERS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify secret is configured
        shell: bash
        run: test -n "$DOG_API_KEY"
      - name: Run mutation suite
        run: npm run test:mutations
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-test-results
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

  allure-report:
    name: Build Allure report
    runs-on: ubuntu-latest
    needs: [public-tests, authenticated-tests, mutation-tests]
    if: ${{ always() && needs.public-tests.result != 'skipped' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Download test artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-test-results"
          path: downloaded-results
          merge-multiple: false
      - name: Merge Allure results
        shell: bash
        run: |
          mkdir -p allure-results
          find downloaded-results -type f -path '*/allure-results/*' -exec cp {} allure-results/ \;
      - name: Generate Allure report
        run: npm run allure:generate
      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
          retention-days: 30
      - name: Publish report link in job summary
        shell: bash
        run: |
          {
            echo "## Allure report"
            echo "The generated report is available in the **allure-report** workflow artifact."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-pages:
    name: Deploy Allure to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: allure-report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
